name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install (core + dev)
        # Não instala o extra "transcription" (torch/whisper): os testes
        # mockam a transcrição, então não é necessário e economiza minutos.
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Lint (ruff)
        run: ruff check meeting_processor tests

      - name: Test (pytest)
        run: pytest tests/ -q

  # O app tem sua própria suíte, no runner nativo do Node — sem npm install:
  # os testes só usam módulos do projeto e do próprio Node.
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Test (node:test)
        run: npm test
        working-directory: desktop

  security:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Audit dependencies (pip-audit)
        # Não falha o build por CVE de dependência transitiva; apenas reporta.
        run: pip-audit || true
