# Synapse - configuração do motor de transcrição
# ==============================================
#
# O app desktop define tudo por variáveis de ambiente (é ele quem sabe o
# binário e o modelo escolhidos na interface). Este arquivo serve a quem
# chama `python -m meeting_processor transcribe` direto no terminal.

# Backend de transcrição:
#   "auto"   -> usa whisper.cpp se encontrado, senão openai-whisper (pip). Padrão.
#   "cpp"    -> força whisper.cpp (mais rápido com GPU; requer binário + modelo .bin)
#   "openai" -> openai-whisper puro Python; baixa o modelo sozinho (mais simples)
whisper_backend: "auto"
whisper_model: "large-v3-turbo"
whisper_language: "pt"
# "auto" deixa a lib decidir; "cuda" força GPU; "cpu" força CPU
# (no whisper.cpp isso adiciona --no-gpu).
whisper_device: "auto"
whisper_initial_prompt: "Transcrição de reunião em português brasileiro."
# 0 => todos os núcleos. O padrão do whisper.cpp é 4, o que desperdiça
# a maior parte de uma CPU moderna.
whisper_threads: 0

# Timeouts de subprocess (segundos). Evitam trava permanente com arquivo
# corrompido.
ffmpeg_timeout: 3600.0
whisper_timeout: 14400.0

# Processamento
temp_dir: ".tmp"
cleanup_temp: true
log_level: "INFO"
