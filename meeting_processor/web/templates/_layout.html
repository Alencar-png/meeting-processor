<!DOCTYPE html>
<html lang="pt-br" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}Meeting Processor{% endblock %}</title>

  <script>
    // Aplica tema antes do primeiro paint (evita flash)
    (function () {
      try {
        var saved = localStorage.getItem('mp-theme');
        if (saved === 'light') document.documentElement.classList.remove('dark');
        else document.documentElement.classList.add('dark');
      } catch (e) {}
    })();
  </script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="/static/app.css?v={{ static_v }}" />
  <script src="https://unpkg.com/htmx.org@1.9.10" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/sortablejs@1.15.2/Sortable.min.js" defer></script>
  <script src="/static/app.js?v={{ static_v }}" defer></script>
</head>
<body class="bg-bg text-ink font-sans min-h-screen antialiased" hx-boost="true">

  <div id="mp-progress"></div>

  <div class="flex min-h-screen">

    {% include "_sidebar.html" %}

    <!-- Conteúdo principal -->
    <main class="flex-1 min-w-0 lg:ml-64">

      <!-- Topbar / breadcrumb -->
      <div class="sticky top-0 z-10 bg-bg/85 backdrop-blur border-b border-line">
        <div class="px-4 lg:px-8 py-3 flex items-center justify-between gap-4">
          <button
            data-action="toggle-sidebar"
            class="lg:hidden p-2 rounded hover:bg-panel transition"
            aria-label="Menu">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
          </button>

          <div class="flex-1 min-w-0">
            <div class="text-xs text-mute hidden sm:block">{% block breadcrumb %}{% endblock %}</div>
            <h1 class="text-base lg:text-lg font-semibold truncate">{% block page_title %}{% endblock %}</h1>
          </div>

          <div class="flex items-center gap-2">
            <button
              data-action="toggle-theme"
              class="p-2 rounded hover:bg-panel transition text-mute hover:text-ink"
              title="Alternar tema" aria-label="Alternar tema">
              <svg class="w-5 h-5 dark:hidden" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/></svg>
              <svg class="w-5 h-5 dark:block" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
            </button>
          </div>
        </div>
      </div>

      <div class="px-4 lg:px-8 py-6 lg:py-8 max-w-7xl">
        {% block content %}{% endblock %}
      </div>
    </main>

  </div>

  <!-- destino dos modais (processamento manual, etc.) -->
  <div id="modal-host"></div>

</body>
</html>
