[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-processor"
version = "0.2.0"
description = "Motor de transcrição de reuniões (Whisper) usado pelo app Synapse"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# Núcleo: configuração e o comando `transcribe`.
# torch/whisper (transcrição em Python) fica em extra — o app desktop usa
# whisper.cpp e não precisa deles.
# Faixas com teto no próximo major evitam quebras silenciosas.
dependencies = [
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
    # Voz neural do chat (vozes do Edge, gratuitas, precisa de internet na hora).
    "edge-tts>=7.0,<8.0",
]

[project.optional-dependencies]
# Transcrição local com openai-whisper (pesado: ~2-3 GB com torch).
# Dispensável se você usar whisper.cpp (binário) via whisper_backend=cpp.
transcription = [
    "openai-whisper>=20230918",
    "torch>=2.0,<3.0",
]
# Ferramentas de desenvolvimento e teste.
dev = [
    "pytest>=8.0,<9.0",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.scripts]
meeting-processor = "meeting_processor.__main__:main"

[tool.setuptools.packages.find]
include = ["meeting_processor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
