[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "meeting-processor"
version = "0.2.0"
description = "Transcrição de reuniões do OBS + resumo por LLM + notas e Kanban no Obsidian"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"

# Núcleo: watcher, pipeline, resumo via LLM (Anthropic + provedores HTTP).
# torch/whisper (transcrição) fica em extra — instale só se precisar.
# Faixas com teto no próximo major evitam quebras silenciosas.
dependencies = [
    "anthropic>=0.85,<1.0",
    "httpx>=0.27,<1.0",
    "watchdog>=3.0,<7.0",
    "pydantic>=2.0,<3.0",
    "pyyaml>=6.0,<7.0",
    "python-dotenv>=1.0,<2.0",
]

[project.optional-dependencies]
# Transcrição local com openai-whisper (pesado: ~2-3 GB com torch).
# Dispensável se você usar whisper.cpp (binário) via whisper_backend=cpp.
transcription = [
    "openai-whisper>=20230918",
    "torch>=2.0,<3.0",
]
# Ferramentas de desenvolvimento e teste.
dev = [
    "pytest>=8.0,<9.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "pip-audit>=2.7",
]

[project.scripts]
meeting-processor = "meeting_processor.__main__:main"

[tool.setuptools.packages.find]
include = ["meeting_processor*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
